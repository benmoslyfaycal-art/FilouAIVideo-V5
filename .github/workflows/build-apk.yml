name: Filou AI Video V5 - Compilation APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Décompresser Filou AI Video V5
        run: |
          mkdir -p filou-v5
          unzip -o FilouAIVideo_V5.zip -d filou-v5

      - name: Corriger la compatibilité Java/Kotlin
        working-directory: filou-v5
        run: |
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
          sed -i 's/jvmTarget *= *"1.8"/jvmTarget = "17"/g' app/build.gradle.kts

      - name: Vérifier Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Compiler l'APK
        working-directory: filou-v5
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: FilouAIVideo-V5-debug
          path: filou-v5/app/build/outputs/apk/debug/*.apk
