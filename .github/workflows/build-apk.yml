name: Filou AI Video V5 - Compilation APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Décompresser Filou AI Video V5
        run: |
          mkdir -p filou-v5
          unzip -o FilouAIVideo_V5.zip -d filou-v5

      - name: Compiler l'APK
        working-directory: filou-v5
        run: gradle --no-daemon :app:assembleDebug

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: FilouAIVideo-V5-APK
          path: filou-v5/app/build/outputs/apk/debug/app-debug.apk
